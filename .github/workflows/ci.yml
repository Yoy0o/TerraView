# CI: every push to main and every pull request.
#
#   verify   typecheck, layering, unit tests, library build + declarations, demo build (Node 22 and 24)
#   package  packs the build and installs it into a fresh host project, the way a consumer
#            would (scripts/check-package.mjs; the tarball is kept as a workflow artifact), then
#            runs the browser smoke tests (playwright.config.ts) on the demo and on that host, in
#            Playwright's Chromium without a GPU: WebGL and WebGPU both on SwiftShader. One job,
#            because the smoke tests need the same build and the same packed host.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Layering (directory directions, import cycles)
        run: npm run check:layers
      - name: Unit tests
        run: npm test
      - name: Build the library and its declarations
        run: npm run build:lib && npm run build:types
      - name: Build the demo
        run: npm run build:demo

  package:
    name: Package and browser smoke
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      # `verify` already type-checked: build without repeating it (`npm run build` would).
      - name: Build the library and its declarations
        run: npm run build:lib && npm run build:types
      - name: Pack and install into a host project (kept for the smoke tests)
        run: node scripts/check-package.mjs --keep-host .smoke/host
      - name: Pack for the artifact
        run: npm pack
      - uses: actions/upload-artifact@v6
        with:
          name: package-tarball
          path: '*.tgz'
          if-no-files-found: error
          retention-days: 14
      - name: Build the demo
        run: npm run build:demo
      - name: Install Chromium
        run: npx playwright install --with-deps --no-shell chromium
      - name: Smoke tests
        run: npm run smoke
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: smoke-report
          path: test-output/
          retention-days: 14
