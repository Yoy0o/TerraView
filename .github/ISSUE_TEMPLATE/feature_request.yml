name: 功能建议 / Feature request
description: 新功能、新数据格式或 API 改进 / A new feature, data format or API improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        动手前可以先看看[路线图](https://github.com/Yoy0o/TerraView/blob/main/docs/agents/roadmap.md)，也许已经在计划里。
        You may want to check the [roadmap](https://github.com/Yoy0o/TerraView/blob/main/docs/agents/roadmap.md) (Chinese) first; it may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: 场景与问题 / Use case
      description: 想做成什么，现在卡在哪里 / What you are trying to build and what is missing today
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法 / Proposed solution
      description: API 草图、配置项或交互方式 / API sketch, options or interaction
      render: ts
  - type: textarea
    id: alternatives
    attributes:
      label: 现在的变通办法 / Workarounds and alternatives
      description: 你现在怎么绕过，或其他产品（CesiumJS 等）怎么做 / How you work around it today, or how other products (CesiumJS, …) do it
  - type: checkboxes
    id: contribute
    attributes:
      label: 参与 / Contribution
      options:
        - label: 我愿意提交 PR 实现它 / I am willing to open a pull request for this
